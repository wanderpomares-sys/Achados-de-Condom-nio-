<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Achados de Condomínios</title>
<meta property="og:title" content="Achados de Condomínios">
<meta property="og:description" content="Venda e doação entre vizinhos">
<meta property="og:image" content="https://achados.app/og.png">
<meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--red:#1A63E8;--dark:#12263F;--gray:#5B6B80;--bg:#F2F6FC;--white:#FFFFFF;--border:#D6E0EE;--shadow:0 2px 12px rgba(0,0,0,.08);--r:16px;--rb:12px;--rc:20px}
*{box-sizing:border-box;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);font-family:Inter,system-ui,-apple-system,sans-serif;font-size:16px;color:var(--dark);overflow-x:hidden}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:16px;color:var(--dark)}
.app{max-width:400px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:140px;overflow-x:hidden}
@media(min-width:420px){.app{border-left:1px solid var(--border);border-right:1px solid var(--border)}}
/* header */
.hdr{position:sticky;top:0;z-index:20;height:64px;background:var(--white);border-bottom:1px solid #E1E9F5;display:flex;align-items:center;justify-content:space-between;padding:0 16px;gap:8px}
.brand{display:flex;align-items:center;gap:8px;min-width:0}
.brand img{width:40px;height:40px;object-fit:contain;flex:none}
.brand b{font-size:16px;font-weight:700;letter-spacing:-.3px;line-height:1.1}.brand b small{display:block;font-size:12px;font-weight:500;color:var(--gray);letter-spacing:0}
.pill{flex:none;border:1px solid var(--border);background:var(--bg);border-radius:var(--rc);padding:6px 12px;font-size:12px;font-weight:700}
.top{background:var(--white);padding:0 16px 16px}
.search{position:relative;margin-top:16px}
.search input{width:100%;height:48px;border:1px solid var(--border);border-radius:12px;padding:0 16px 0 44px;outline:0;background:var(--white)}
.search input:focus{border-color:var(--red)}
.search span{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:16px}
.scopes{display:flex;gap:8px;margin-top:16px}
.scopes button{flex:1;height:44px;border-radius:12px;background:var(--bg);color:var(--dark);font-weight:700;font-size:14px}
.scopes button.on{background:var(--red);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px 6px;margin-top:16px}
.chip{height:36px;padding:0 8px;border:1px solid var(--border);border-radius:var(--rc);background:var(--white);font-size:12px;font-weight:500;white-space:nowrap}
.chip.on{border-color:var(--red);background:#E8F0FE;color:var(--red);font-weight:700}
/* cards */
.list{padding:16px 0 0}
.card{width:calc(100% - 32px);margin:0 auto 16px;background:var(--white);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;position:relative}
.card.boost{outline:2px solid var(--red)}
.img{height:180px;display:flex;align-items:center;justify-content:center;font-size:64px;position:relative;background-size:cover;background-position:center;cursor:pointer}
.badge{position:absolute;top:12px;left:12px;color:#fff;font-size:11px;font-weight:700;padding:4px 8px;border-radius:6px;letter-spacing:.3px}
.dist{position:absolute;bottom:12px;right:12px;background:#fff;border:1px solid var(--border);border-radius:var(--rc);padding:3px 10px;font-size:12px;font-weight:600}
.boostTag{position:absolute;top:12px;right:12px;background:var(--red);color:#fff;font-size:11px;font-weight:700;padding:4px 8px;border-radius:6px}
.body{padding:16px;cursor:pointer}
.title{font-size:16px;font-weight:700;margin:0 0 4px;line-height:1.3}
.price{font-size:18px;font-weight:700}.price.free{color:#2ECC71}
.old{font-size:13px;color:var(--gray);text-decoration:line-through;margin-left:8px;font-weight:400}
.meta{font-size:13px;color:var(--gray);margin-top:8px;line-height:1.4}
.foot{border-top:1px solid #E6EDF7;padding:12px 16px;display:flex;align-items:center;gap:8px}
.av{width:32px;height:32px;border-radius:50%;background:#DBE8FD;color:var(--red);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none}
.seller{font-size:13px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seller i{color:#2ECC71;font-style:normal;margin-left:4px}
.quero{height:36px;padding:0 20px;background:var(--red);color:#fff;font-weight:700;font-size:14px;border-radius:8px;flex:none}
.quero:active{opacity:.85}
.sponsor{background:#FFF8E1;border:1px solid #FFE082;box-shadow:none}
.sponsor .lbl{position:absolute;top:8px;left:12px;font-size:10px;font-weight:700;color:var(--dark);letter-spacing:.4px;z-index:2;background:#FFE082;padding:2px 6px;border-radius:4px}
.sponsor .img{height:120px;font-size:48px}
.sponsor .quero{background:var(--dark)}
.promo{width:calc(100% - 32px);margin:0 auto 16px;background:#fff;border:1px solid var(--border);border-radius:var(--r);padding:16px;display:flex;align-items:center;gap:12px;position:relative}
.promo p{margin:0;font-size:14px;font-weight:600;flex:1;padding-right:16px;line-height:1.35}
.promo .go{height:36px;padding:0 14px;background:#111;color:#fff;border-radius:8px;font-weight:700;font-size:13px;flex:none}
.promo .x{position:absolute;top:2px;right:6px;font-size:16px;color:var(--gray);padding:6px}
.empty{text-align:center;color:var(--gray);padding:48px 32px;font-size:14px}
.empty b{display:block;font-size:48px;margin-bottom:8px}
/* nav */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:400px;height:64px;background:#fff;border-top:1px solid #E1E9F5;display:flex;z-index:30}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--gray);font-size:11px;font-weight:700}
.nav button span{font-size:22px;line-height:1;filter:grayscale(1);opacity:.7}
.nav button.on{color:var(--red)}.nav button.on span{filter:none;opacity:1}
.fab{position:fixed;bottom:80px;left:50%;margin-left:calc(min(100vw,400px)/2 - 72px);width:56px;height:56px;border-radius:50%;background:var(--red);color:#fff;font-size:28px;box-shadow:0 4px 16px rgba(26,99,232,.4);z-index:31;display:flex;align-items:center;justify-content:center;line-height:1}
/* sheets */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{width:100%;max-width:400px;max-height:94vh;background:#fff;border-radius:20px 20px 0 0;overflow-y:auto;animation:up .28s ease;position:relative}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}@keyframes fade{from{opacity:0}to{opacity:1}}
.handle{width:40px;height:4px;background:#D1D5DB;border-radius:2px;margin:8px auto}
.dimg{height:240px;display:flex;align-items:center;justify-content:center;font-size:88px;position:relative;background-size:cover;background-position:center}
.dbody{padding:20px 20px 96px}
.dbody h2{font-size:20px;margin:0 0 8px;font-weight:700;line-height:1.3}
.dprice{font-size:22px;font-weight:700}
.desc{font-size:16px;line-height:1.5;margin:16px 0}
.box{background:#F9FAFB;border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.ver{color:#16A34A;font-weight:600;font-size:14px;margin-top:12px}
.proof{margin-top:12px;font-size:13px;color:var(--red);font-weight:700}
.cta{position:sticky;bottom:0;height:72px;background:#fff;border-top:1px solid #E1E9F5;display:flex;align-items:center;gap:8px;padding:0 16px;margin-top:-72px}
.heart{width:48px;height:48px;border:1px solid var(--border);border-radius:12px;font-size:22px;flex:none}
.big{flex:1;height:52px;background:var(--red);color:#fff;border-radius:12px;font-weight:700;font-size:16px}
.share{width:48px;height:48px;border:1px solid var(--border);border-radius:12px;font-size:20px;flex:none}
.close{position:absolute;top:16px;right:12px;z-index:3;width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.45);color:#fff;font-size:16px}
/* forms */
.form{padding:8px 20px 24px;display:flex;flex-direction:column;gap:16px}
.form h2{margin:0;font-size:20px}
.form label{font-size:14px;font-weight:600;display:block;margin-bottom:6px}
.form input[type=text],.form input[type=number],.form textarea,.form select{width:100%;border:1px solid var(--border);border-radius:12px;padding:12px 16px;background:#fff;outline:0}
.form input:focus,.form textarea:focus,.form select:focus{border-color:var(--red)}
.form input[type=text],.form select,.form input[type=number]{height:48px}
.form textarea{min-height:88px;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap}
.opt{flex:1;min-width:120px;height:44px;border:1px solid var(--border);border-radius:12px;font-weight:600;font-size:14px;background:#fff}
.opt.on{border-color:var(--red);background:#E8F0FE;color:var(--red)}
.cta52{height:52px;width:100%;background:var(--red);color:#fff;border-radius:12px;font-weight:700;font-size:16px}
.cta48{height:48px;width:100%;background:var(--red);color:#fff;border-radius:12px;font-weight:700;font-size:16px}
.cta52:disabled,.cta48:disabled{background:#9DBEF5}
.up{border:1px dashed #CBD5E1;border-radius:12px;height:96px;display:flex;align-items:center;justify-content:center;color:var(--gray);font-size:14px;background:#F9FAFB;background-size:cover;background-position:center;cursor:pointer}
.sug{border:1px solid var(--border);border-radius:12px;overflow:hidden}
.sug button{display:flex;width:100%;justify-content:space-between;align-items:center;padding:12px 16px;text-align:left;font-size:14px;border-bottom:1px solid #E6EDF7;background:#fff}
.sug button:last-child{border-bottom:0}
.sug button.on{background:#E8F0FE;color:var(--red);font-weight:700}
.sug small{color:var(--gray);font-weight:500}
/* onboarding */
.onb{max-width:400px;margin:0 auto;min-height:100vh;padding:48px 24px 32px;display:flex;flex-direction:column;gap:16px;background:#fff}
.onb img{width:96px;height:96px;object-fit:contain;margin:0 auto}
.onb h1{font-size:24px;text-align:center;margin:0;line-height:1.25;font-weight:800}
.onb p{text-align:center;color:var(--gray);margin:0 0 8px;font-size:14px}
/* agenda */
.ag{padding:16px}
.ag h2{font-size:18px;margin:0 0 16px}
.tl{position:relative;padding-left:28px}
.tl:before{content:"";position:absolute;left:7px;top:8px;bottom:8px;width:2px;background:var(--border)}
.ev{position:relative;background:#fff;border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin-bottom:16px}
.ev:before{content:"";position:absolute;left:-28px;top:20px;width:16px;height:16px;border-radius:50%;background:var(--c);border:3px solid var(--bg)}
.ev .d{display:inline-block;background:var(--c);color:#fff;font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;margin-bottom:8px}
.ev h3{font-size:16px;margin:0 0 4px}
.ev .m{font-size:13px;color:var(--gray);line-height:1.4}
.scar{color:var(--red);font-weight:700}
/* chats/perfil */
.pad{padding:16px}
.row2{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);padding:12px 16px;margin-bottom:12px;display:flex;align-items:center;gap:12px}
.row2 .e{font-size:28px}.row2 div{flex:1;min-width:0}.row2 b{font-size:14px;display:block}.row2 small{color:var(--gray);font-size:13px}
.sec{font-size:18px;font-weight:700;margin:0 0 16px}
.kv{display:flex;justify-content:space-between;font-size:14px;padding:10px 0;border-bottom:1px solid #E6EDF7}.kv:last-child{border:0}.kv span{color:var(--gray)}
.ghost{height:44px;width:100%;border:1px solid var(--border);border-radius:12px;background:#fff;font-weight:600;font-size:14px;margin-top:8px}
/* rewarded */
.rw{padding:24px 20px;text-align:center}
.rw .tv{height:160px;border-radius:var(--rb);background:linear-gradient(135deg,#1F2937,#111827);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:14px;margin:16px 0}
.rw .tv b{font-size:40px}
.prog{height:8px;background:#F3F4F6;border-radius:4px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--red);width:0;transition:width .25s linear}
.rw h3{margin:0;font-size:18px}.rw p{color:var(--gray);font-size:14px;margin:8px 0 0}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:90;max-width:340px;text-align:center;animation:fade .2s;box-shadow:0 4px 16px rgba(0,0,0,.3)}
.push{position:fixed;top:8px;left:50%;transform:translateX(-50%);width:calc(100% - 16px);max-width:384px;background:#fff;border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,.2);padding:12px 16px;z-index:95;display:flex;gap:12px;align-items:center;animation:fade .3s;cursor:pointer}
.push img{width:32px;height:32px}.push b{font-size:13px;display:block}.push small{font-size:13px;color:var(--gray)}

/* v2 compact cards */
.card{display:flex;gap:12px;padding:12px;align-items:stretch}
.card .tile{flex:none;width:116px;height:132px;border-radius:12px;position:relative;display:flex;align-items:center;justify-content:center;font-size:52px;background-size:cover;background-position:center;cursor:pointer;overflow:hidden}
.card .tile:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.75),transparent 60%)}
.card .tile>span.em{position:relative;filter:drop-shadow(0 6px 8px rgba(0,0,0,.18))}
.card .badge{top:8px;left:8px;font-size:10px;padding:3px 7px;border-radius:6px;z-index:1}
.card .dist{bottom:8px;right:auto;left:8px;font-size:11px;padding:2px 8px;z-index:1}
.card .main{flex:1;min-width:0;display:flex;flex-direction:column}
.card .title{font-size:16px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin:0}
.card .priceRow{margin-top:6px;display:flex;align-items:baseline;flex-wrap:wrap}
.card .old{margin-left:6px}
.card .meta{margin-top:6px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .meta2{font-size:12px;color:var(--gray);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .bot{margin-top:auto;padding-top:8px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.card .want{font-size:12px;color:var(--red);font-weight:700}
.card.boost{outline:0;box-shadow:0 0 0 2px var(--red),var(--shadow)}
.card .boostTag{top:auto;right:auto;bottom:auto;left:0;top:-1px;position:absolute}
.sponsor .tile{background:linear-gradient(135deg,#FFF3C4,#FFE082)!important;cursor:default}
.sponsor .lbl{position:static;display:inline-block;margin-bottom:4px;align-self:flex-start}
.listhead{display:flex;justify-content:space-between;align-items:baseline;padding:0 16px 12px}
.listhead b{font-size:18px}.listhead span{font-size:13px;color:var(--gray)}
.greet{padding-top:12px;font-size:14px;color:var(--gray)}.greet b{color:var(--dark);font-size:16px}
.fab{width:auto;height:48px;border-radius:24px;padding:0 20px;font-size:15px;font-weight:700;gap:6px;margin-left:0;left:auto;right:max(16px,calc(50% - 184px));bottom:80px}
.fab i{font-style:normal;font-size:22px;line-height:1}
.promo{background:linear-gradient(135deg,#FFF 0%,#F3F8FF 100%);border:1px solid #C9DAF8}
.promo .ic{font-size:28px;flex:none}
.promo .x{position:static;margin:-8px -8px 0 0;align-self:flex-start;flex:none}
.promo p{padding-right:0}
.chip{font-size:12px;padding:0 8px}.fab{transition:transform .25s,opacity .25s}.fab.hide{transform:translateY(90px);opacity:0;pointer-events:none}
.scopes button{font-size:14px}

/* v3 azul + seções + fontes maiores + botões simétricos */
:root{--red:#1A63E8;--dark:#12263F;--gray:#5B6B80;--bg:#F2F6FC;--border:#D6E0EE}
html,body{font-size:17px}
.hdr{height:68px;border-bottom:2px solid #E1E9F5}
.brand b{font-size:19px}.brand b small{font-size:13px}
.pill{font-size:14px;padding:8px 14px;background:#E8F0FE;border-color:#C9DAF8;color:var(--red)}
.top{padding:4px 16px 20px;border-bottom:1px solid #E1E9F5;box-shadow:0 4px 12px rgba(18,38,63,.04)}
.greet{display:flex;flex-direction:column;gap:2px;font-size:15px}.greet b{font-size:22px}.greet span{font-size:14px}
.greet{flex-direction:column}
.search{margin-top:14px}.search input{height:52px;font-size:17px;border-width:2px}.search span{font-size:18px}
.lab{font-size:13px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--gray);margin:20px 0 10px}
.scopes{margin-top:0;gap:12px;display:grid;grid-template-columns:1fr 1fr}
.scopes button{height:52px;font-size:15px;border:2px solid var(--border);background:#fff}
.scopes button.on{border-color:var(--red);background:var(--red);color:#fff}
.chips{margin-top:0;display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.chip{height:68px;padding:0 2px;font-size:13px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-radius:14px;border-width:2px;white-space:nowrap}
.chip em{font-style:normal;font-size:24px;line-height:1}
.chip.on{background:#E8F0FE;border-color:var(--red);color:var(--red);font-weight:700}
.list{padding:8px 0 0}
.blk{background:#fff;margin:0 0 24px;padding:20px 0 4px;border-top:1px solid #E1E9F5;border-bottom:1px solid #E1E9F5}
.blk .card{box-shadow:none;border:1px solid #E1E9F5;background:#F8FAFE}
.blk .card.sponsor{background:#FFF8E1;border-color:#FFE082}
.blk .card.boost{box-shadow:0 0 0 2px var(--red)}
.sec2{display:flex;align-items:center;gap:12px;padding:0 16px 16px}
.sec2 .ico{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}
.sec2 .tx{flex:1;min-width:0}.sec2 b{display:block;font-size:20px;font-weight:800}.sec2 span{font-size:14px;color:var(--gray);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec2 .cnt{min-width:36px;height:36px;border-radius:18px;background:#E8F0FE;color:var(--red);font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;padding:0 10px;flex:none}
.card{gap:14px;padding:14px}
.card .tile{width:120px;height:150px;font-size:56px}
.card .title{font-size:18px;font-weight:700}
.priceRow .price,.card .price{font-size:22px}
.card .old{font-size:14px}
.card .meta{font-size:14px;margin-top:8px}.card .meta2{font-size:14px;margin-top:2px}
.card .want{font-size:14px}
.card .badge{font-size:11px}.card .dist{font-size:12px}
.quero,.promo .go{width:108px;height:46px;padding:0;font-size:16px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center}
.sponsor .quero{background:var(--dark)}
.promo{width:calc(100% - 32px);padding:16px;gap:12px;background:#EEF4FF;border:2px solid #C9DAF8;border-radius:16px;margin:0 auto 16px}
.promo p{font-size:16px;font-weight:700}
.promo .go{background:var(--dark)}
.nav{height:68px}.nav button{font-size:12px}.nav button span{font-size:24px}
.fab{height:52px;font-size:16px;bottom:84px;padding:0 22px}
.dbody h2{font-size:22px}.dprice{font-size:24px}.desc{font-size:17px}.box{font-size:15px}.ver,.proof{font-size:15px}
.cta{height:76px;margin-top:-76px;gap:10px}
.heart,.share{width:52px;height:52px;border-radius:12px}.big{height:52px;font-size:17px;border-radius:12px}
.opt{height:52px;font-size:15px}.form label{font-size:15px}.cta52,.cta48{height:52px;font-size:17px}
.form input[type=text],.form select,.form input[type=number]{height:52px}
.ev h3{font-size:18px}.ev .m{font-size:14px}.ev .d{font-size:12px}.ag h2{font-size:20px}
.row2 b{font-size:16px}.row2 small{font-size:14px}.kv{font-size:16px}.ghost{height:52px;font-size:16px}
.rw h3{font-size:20px}.rw p{font-size:16px}
.toast{font-size:15px}

/* v4 barra vertical de atalhos */
.layout{display:flex;align-items:flex-start;gap:0}

.rb.on{background:#E8F0FE;border-color:var(--red);color:var(--red)}
.rb.add{background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 4px 12px rgba(26,99,232,.35)}
.rb.add em{font-size:26px;font-weight:700}
.sep{width:32px;height:2px;background:#E1E9F5;flex:none;border-radius:1px}
.layout .blk{margin:0 0 20px 0;border-left:0}
.layout .card{width:calc(100% - 20px);margin:0 auto 12px;padding:12px;gap:12px}
.layout .card .tile{width:96px;height:140px;font-size:46px}
.layout .card .title{font-size:17px}
.layout .priceRow .price,.layout .card .price{font-size:20px}
.layout .quero,.layout .promo .go{width:96px;height:44px;font-size:15px}
.layout .sec2{padding:0 12px 14px;gap:10px}.layout .sec2 .ico{width:40px;height:40px}.layout .sec2 b{font-size:18px}.layout .sec2 span{font-size:13px}
.layout .promo{width:calc(100% - 20px);flex-wrap:wrap;padding:14px}
.layout .promo p{flex:1 1 140px;font-size:15px}
.layout .promo .go{flex:1 1 100%;width:100%}
.layout .promo .ic{font-size:24px}
.layout .listhead{padding:0 12px 12px}
.layout .card .meta,.layout .card .meta2{font-size:13px}
.layout .card .want{font-size:13px}

.greet b{display:inline;font-size:22px}
.rb{width:56px;height:56px}.rail{width:72px;gap:6px}
.layout .promo{position:relative;padding-right:40px}
.layout .promo .x{position:absolute;top:6px;right:6px;margin:0}
.layout .card .want{font-size:12px;white-space:nowrap}

/* v5 barra lateral fixa azul */
.app.feedpage{padding-left:72px}
.feedpage .hdr{margin-left:-72px}
.layout{display:block}
.rail{position:fixed;top:68px;bottom:68px;left:max(0px,calc(50% - 200px));width:72px;max-height:none;margin:0;border-radius:0;border:0;background:linear-gradient(180deg,#1A63E8 0%,#0B3F9E 100%);padding:10px 8px;gap:6px;justify-content:space-between;overflow:hidden;box-shadow:2px 0 14px rgba(11,63,158,.25);z-index:25}
.rb{width:100%;height:auto;flex:1 1 0;min-height:0;max-height:60px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);color:#fff;font-size:10.5px;border-radius:12px}
.rb em{font-size:20px}
.rb.on{background:#fff;color:#1A63E8;border-color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.rb.add{background:#FFB020;border-color:#FFB020;color:#12263F;box-shadow:0 3px 10px rgba(0,0,0,.25)}
.rb.add em{font-size:24px}
.sep{background:rgba(255,255,255,.35);flex:none;width:32px;height:2px}
.feedpage .scopes button{font-size:14px;padding:0 4px}
.feedpage .top{padding-left:16px}

 sections.forEach(([ic,t,sub,arr,col],si2)=>{

function saveCondo(){
 const g=S.reg;const name=g.name.trim();
 if(!name){toast('Informe o nome do condomínio');return}
 if(CONDOS.some(c=>c[0].toLowerCase()===name.toLowerCase())){toast('Esse condomínio já está na lista');return}
 const c=[name,0,g.bairro.trim(),g.cidade.trim(),g.end.trim()];
 CONDOS.push(c);const saved=store.get('condos',[]);saved.push(c);store.set('condos',saved);
 if(g.mode==='onb'){S.onb.condo=name;S.onb.q=''}
 else{S.user.condo=name;S.condoSheet=false;S.cq='';save()}
 S.reg={open:false,mode:g.mode,name:'',end:'',bairro:'',cidade:'Mogi das Cruzes'};
 render();toast('Condomínio cadastrado ✓');
}

 <div class="form"><h2>Novo anúncio</h2>
  <div><label>Título</label><input type="text" id="f-title" value="${esc(f.title)}" placeholder="O que você quer anunciar?"></div>
  <div><label>Tipo</label><select id="f-type">${Object.entries(TYPES).map(([k,v])=>`<option value="${k}" ${f.type===k?'selected':''}>${v.l[0]+v.l.slice(1).toLowerCase()}</option>`).join('')}</select></div>
  <div><label>Preço</label><div class="row"><button class="opt ${f.free?'on':''}" data-free="1">🎁 Grátis</button><button class="opt ${!f.free?'on':''}" data-free="0">💰 Com preço</button></div>
   ${f.free?'':`<input type="number" inputmode="decimal" id="f-price" value="${esc(f.price)}" placeholder="R$" style="margin-top:8px">`}</div>
  <div><label>Foto</label><label class="up" style="${f.img?`background-image:url(${f.img});color:transparent`:''}">📷 Toque para enviar<input type="file" accept="image/*" id="f-img" hidden></label></div>
  <div><label>Descrição</label><textarea id="f-desc" placeholder="Estado, medidas, como retirar...">${esc(f.desc)}</textarea></div>
  <div><label>Alcance</label><div class="row"><button class="opt ${f.reach==='pred'?'on':''}" data-reach="pred">🏢 Só meu prédio</button><button class="opt ${f.reach==='viz'?'on':''}" data-reach="viz">📍 Vizinhos 2km</button></div></div>
  <button class="cta52" id="f-go" ${f.title.trim()?'':'disabled'}>Publicar</button></div></div></div>`;
}
function reward(){
 const r=S.reward;const done=r.left<=0;
 const titles={want:'Quero este item',whats:'Liberar WhatsApp',boost:'Destacar anúncio por 24h'};
 return `<div class="ov"><div class="sheet"><div class="handle"></div><div class="rw">
  ${done?`<div style="font-size:48px">🎉</div><h3>${r.kind==='boost'?'Anúncio em destaque por 24h!':'WhatsApp liberado!'}</h3>
   <p>${r.kind==='boost'?'Seu anúncio aparece primeiro nos 5 prédios.':'Mensagem pronta copiada. É só colar na conversa.'}</p>
   ${r.kind==='boost'?'':`<div class="row2" style="margin:16px 0 0;text-align:left"><div><small>${esc(r.msg)}</small></div></div>`}
   <button class="cta52" style="margin-top:16px" data-rwdone>${r.kind==='boost'?'Ver no feed':'Abrir WhatsApp'}</button>`
  :`<h3>${titles[r.kind]}</h3><p>Ajude o app continuar grátis 💛</p>
   <div class="tv"><b>${r.left}s</b>vídeo patrocinado (demo)</div>
   <div class="prog"><i style="width:${(1-r.left/REWARD_SECS)*100}%"></i></div>
   <button class="ghost" data-rwcancel>Cancelar</button>`}
 </div></div></div>`;
}
function nav(){
 const it=[['feed','🏠','Feed'],['agenda','📅','Agenda'],['chats','💬','Chats'],['perfil','👤','Perfil']];
 return `<nav class="nav">${it.map(([k,i,l])=>`<button class="${S.tab===k?'on':''}" data-tab="${k}"><span>${i}</span>${l}</button>`).join('')}</nav>`;
}
function render(){
 const keepQ=document.activeElement&&document.activeElement.id;const sel=document.activeElement&&document.activeElement.selectionStart;
 const root=document.getElementById('root');
 if(!S.user){root.innerHTML=deEmoji(onboarding());restore(keepQ,sel);return}
 const body={feed,agenda,chats,perfil}[S.tab]();
 root.innerHTML=deEmoji(`<div class="app ${S.tab==='feed'?'feedpage':''}">${body}</div>${nav()}${S.detail?detail():''}${S.newPost?newPost():''}${S.condoSheet?condoSheet():''}${S.mapFor?mapSheet():''}${S.reward?reward():''}${S.toast?`<div class="toast">${esc(S.toast)}</div>`:''}${S.pushMsg?`<div class="push" data-pushopen="${S.pushMsg.id}"><img src="${LOGO}" alt=""><div><b>Achados • novo no seu prédio</b><small>${esc(S.pushMsg.title)}</small></div></div>`:''}`);
 restore(keepQ,sel);
}
function restore(id,pos){if(!id)return;const el=document.getElementById(id);if(el&&el.focus){el.focus();try{if(pos!=null)el.setSelectionRange(pos,pos)}catch(e){}}}
function toast(m){S.toast=m;render();clearTimeout(mem.tt);mem.tt=setTimeout(()=>{S.toast=null;render()},2400)}

/* ---------- actions ---------- */
function openPost(id){const p=S.posts.find(x=>x.id===id);if(!p)return;p.views++;save();S.detail=id;render()}
function msgFor(p){return `Olá! Vi seu anúncio "${p.title}" no Achados de Condomínios e tenho interesse. Ainda está disponível?`}
function startReward(kind,postId){
 const p=S.posts.find(x=>x.id===postId);
 S.reward={kind,postId,left:REWARD_SECS,msg:p?msgFor(p):''};render();
 clearInterval(mem.rw);
 mem.rw=setInterval(()=>{if(!S.reward){clearInterval(mem.rw);return}S.reward.left--;if(S.reward.left<=0){clearInterval(mem.rw);finishReward()}render()},1000);
}
function finishReward(){
 const r=S.reward;const p=S.posts.find(x=>x.id===r.postId);
 if(r.kind==='boost'&&p){p.boostedUntil=now()+24*H}
 else if(p){
  if(r.kind==='want'||!S.interests.find(i=>i.postId===p.id)){p.wants++;S.interests.push({postId:p.id,userId:S.user.id,ts:now()})}
  try{navigator.clipboard&&navigator.clipboard.writeText(r.msg).catch(()=>{})}catch(e){}
 }
 save();
}
function share(id){
 const p=S.posts.find(x=>x.id===id);
 const url=`https://achados.app/p/${id}`;
 const text=`${p.title} — veja no Achados de Condomínios: ${url}`;
 window.open('https://wa.me/?text='+encodeURIComponent(text),'_blank');
}
function resizeImg(file,cb){
 const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const m=640,s=Math.min(1,m/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.7))};im.src=fr.result};fr.readAsDataURL(file);
}
function simulatePush(){
 clearTimeout(mem.push);
 mem.push=setTimeout(()=>{
  if(!S.user||!S.push)return;
  const p={id:'p'+now(),title:'Cadeira de escritório ergonômica',price:120,originalPrice:380,type:'venda',emoji:'💺',distance:0,building:S.user.condo+' • 5º andar',ts:now(),seller:'Renata',apt:'509',verified:true,views:0,wants:0,description:'Cadeira ergonômica com apoio lombar, regulagem de altura. Pouco uso.',isMy:true,boostedUntil:0};
  S.posts.unshift(p);save();S.pushMsg=p;render();
  setTimeout(()=>{S.pushMsg=null;render()},5000);
 },FAST?2000:20000);
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-open],[data-quero],[data-sp],[data-whats],[data-scope],[data-filter],[data-tab],[data-new],[data-close],[data-dismiss],[data-boostpromo],[data-fav],[data-share],[data-condo],[data-free],[data-reach],[data-rwdone],[data-rwcancel],[data-reset],[data-pushtoggle],[data-pushopen],[data-ovclose],[data-map],[data-condosheet],[data-condopick],[data-regopen],[data-regcancel],[data-regsave]');
 if(!t)return;
 const d=t.dataset;
 if(d.ovclose!==undefined&&e.target!==t)return; // click dentro do sheet
 if(d.ovclose!==undefined){if(S.mapFor){S.mapFor=null;render();return}S.detail=null;S.newPost=false;S.condoSheet=false;S.mapFor=null;render();return}
 if(d.open){openPost(d.open)}
 else if(d.quero){startReward('want',d.quero)}
 else if(d.sp){toast('Anúncio patrocinado (demo)')}
 else if(d.whats){startReward('whats',d.whats)}
 else if(d.scope){S.scope=d.scope;render()}
 else if(d.filter){S.filter=d.filter;render()}
 else if(d.tab){S.tab=d.tab;window.scrollTo(0,0);render()}
 else if(t.hasAttribute('data-new')){S.form={title:'',type:'venda',free:false,price:'',img:null,desc:'',reach:'viz'};S.newPost=true;render()}
 else if(t.hasAttribute('data-close')){if(S.mapFor){S.mapFor=null;render();return}S.detail=null;S.newPost=false;S.condoSheet=false;S.mapFor=null;render()}
 else if(d.map){S.mapFor=d.map;render()}
 else if(t.hasAttribute('data-condosheet')){S.condoSheet=true;S.cq='';S.reg.open=false;render()}
 else if(d.condopick){S.user.condo=d.condopick;S.condoSheet=false;save();render();toast('Condomínio alterado: '+d.condopick)}
 else if(d.regopen){S.reg={...S.reg,open:true,mode:d.regopen};render()}
 else if(t.hasAttribute('data-regcancel')){S.reg.open=false;render()}
 else if(t.hasAttribute('data-regsave')){saveCondo()}
 else if(t.hasAttribute('data-dismiss')){S.promo=false;render()}
 else if(t.hasAttribute('data-boostpromo')){
  const mine=S.posts.filter(p=>p.mine).sort((a,b)=>b.ts-a.ts)[0];
  if(mine)startReward('boost',mine.id);
  else{toast('Publique um anúncio primeiro para destacá-lo');S.form={title:'',type:'venda',free:false,price:'',img:null,desc:'',reach:'viz'};S.newPost=true;render()}
 }
 else if(d.fav){const i=S.favs.indexOf(d.fav);i>=0?S.favs.splice(i,1):S.favs.push(d.fav);save();render()}
 else if(d.share){share(d.share)}
 else if(d.condo){S.onb.condo=d.condo;render()}
 else if(d.free!==undefined){S.form.free=d.free==='1';render()}
 else if(d.reach){S.form.reach=d.reach;render()}
 else if(t.hasAttribute('data-rwcancel')){clearInterval(mem.rw);S.reward=null;render()}
 else if(t.hasAttribute('data-rwdone')){
  const r=S.reward;S.reward=null;
  if(r.kind==='boost'){S.detail=null;S.tab='feed';window.scrollTo(0,0)}
  else window.open('https://wa.me/?text='+encodeURIComponent(r.msg),'_blank');
  render();
 }
 else if(t.hasAttribute('data-reset')){S.user=null;S.onb={name:'',apt:'',condo:null,q:''};save();try{localStorage.removeItem('achados_user')}catch(e){}render()}
 else if(t.hasAttribute('data-pushtoggle')){
  S.push=!S.push;save();
  if(S.push){try{window.Notification&&Notification.requestPermission()}catch(e){}simulatePush();toast('Notificações ativadas. Simulando novo post em instantes…')}
  else render();
 }
 else if(d.pushopen){S.pushMsg=null;S.tab='feed';render();openPost(d.pushopen)}
});
document.addEventListener('input',e=>{
 const id=e.target.id;
 if(id==='q'){S.q=e.target.value;render()}
 else if(id==='o-name'){S.onb.name=e.target.value;const b=document.getElementById('o-go');if(b)b.disabled=!(S.onb.name.trim()&&S.onb.apt.trim()&&S.onb.condo)}
 else if(id==='o-apt'){S.onb.apt=e.target.value;const b=document.getElementById('o-go');if(b)b.disabled=!(S.onb.name.trim()&&S.onb.apt.trim()&&S.onb.condo)}
 else if(id==='o-q'){S.onb.q=e.target.value;render()}
 else if(id==='c-q'){S.cq=e.target.value;render()}
 else if(id==='r-name')S.reg.name=e.target.value;
 else if(id==='r-end')S.reg.end=e.target.value;
 else if(id==='r-bairro')S.reg.bairro=e.target.value;
 else if(id==='r-cidade')S.reg.cidade=e.target.value;
 else if(id==='f-title'){S.form.title=e.target.value;document.getElementById('f-go').disabled=!S.form.title.trim()}
 else if(id==='f-price')S.form.price=e.target.value;
 else if(id==='f-desc')S.form.desc=e.target.value;
});
document.addEventListener('change',e=>{
 if(e.target.id==='f-type')S.form.type=e.target.value;
 if(e.target.id==='f-img'&&e.target.files[0])resizeImg(e.target.files[0],u=>{S.form.img=u;render()});
});
document.addEventListener('click',e=>{
 if(e.target.id==='o-go'){
  const o=S.onb;S.user={id:'u'+now(),name:o.name.trim(),apt:o.apt.trim(),condo:o.condo,cityShort:'Mogi'};scrollTo(0,0);
  S.posts.forEach(p=>{});save();render();
 }
 if(e.target.id==='f-go'){
  const f=S.form;if(!f.title.trim())return;
  const my=f.reach==='pred';
  const p={id:'p'+now(),title:f.title.trim(),price:f.free?0:(f.price===''?null:Number(f.price)),type:f.type,emoji:DEFAULT_EMOJI[f.type],imageUrl:f.img||null,distance:0,building:S.user.condo,ts:now(),seller:S.user.name,apt:S.user.apt,verified:false,views:0,wants:0,description:f.desc.trim(),isMy:true,mine:true,reach:f.reach,boostedUntil:0};
  S.posts.unshift(p);S.newPost=false;S.form=null;S.scope=my?'pred':'viz';S.filter='all';save();render();toast('Anúncio publicado! 🎉');
 }
});
let lastY=0;
addEventListener('scroll',()=>{const y=scrollY,f=document.querySelector('.fab');if(f)f.classList.toggle('hide',y>lastY+4&&y>200);lastY=y},{passive:true});
render();
if(S.push)simulatePush();
</script>
</body>
</html>
